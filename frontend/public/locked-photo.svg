<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80" role="presentation">
  <!--
    ჩაკეტილი ალბომის ადგილსამყოფელი (Tasks §7.10).
    ⚠️ ეს **არ არის რეალური ფოტოს ბლარი** — არავითარი შინაარსი აქ არ არის.
       ნამდვილი ფაილი პასუხშიც არ მოდის და პირად დისკზეა (§7.9).
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b8fa3" />
      <stop offset="50%" stop-color="#6e7288" />
      <stop offset="100%" stop-color="#9aa0b4" />
    </linearGradient>
    <filter id="b" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>
  <rect width="120" height="80" fill="url(#g)" />
  <g filter="url(#b)" opacity="0.55">
    <circle cx="34" cy="30" r="20" fill="#c7cad6" />
    <circle cx="86" cy="56" r="26" fill="#4f5366" />
    <rect x="52" y="8" width="44" height="30" rx="8" fill="#b0b5c6" />
  </g>
</svg>
