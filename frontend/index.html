<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      PWA — „მთავარ ეკრანზე დამატება" (FEAT-15).

      ⚠️ **`theme-color` ორია და ეს აუცილებელია.** manifest-ს მხოლოდ ერთი
      აქვს, ე.ი. მუქ თემაზე ბრაუზერის ზოლი ნათელი ლაქა იქნებოდა. ორივე
      მნიშვნელობა `index.css`-ის `--background`-ია — მესამე პალიტრა აქ
      იმავე დღეს დაშორდებოდა თემას.

      ⚠️ **iOS manifest-ის ხატულას **არ** კითხულობს** — მას `apple-touch-icon`
      სჭირდება და **მხოლოდ PNG**. ამ რეპოში რასტერიზატორი არ არის
      (და ერთი ხატულისთვის მისი დამატება ზედმეტია), ამიტომ iPhone-ზე
      ხატულა ეკრანის სურათი იქნება. სხვა ყველაფერი — standalone-რეჟიმი,
      სახელი, ფერი — იქაც მუშაობს.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f7f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16130e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mediary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Mediary</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
