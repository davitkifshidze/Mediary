# ============================================================
#  Dependabot — დამოკიდებულებების განახლება (Tasks DEBT-15)
#
#  ⚠️ **CI-ის `composer audit`/`npm audit` და ეს ერთი და იგივე არ არის.**
#  აუდიტი ამბობს „აქ ცნობილი მოწყვლადობაა"; Dependabot კი PR-ს ხსნის —
#  ე.ი. პირველი პრობლემას პოულობს, მეორე მას წყვეტს. ორივე საჭიროა:
#  აუდიტის გარეშე PR შეიძლება კვირებით იწვეს, Dependabot-ის გარეშე კი
#  წითელი CI ხელით განახლებას მოითხოვს.
#
#  ⚠️ **კვირაში ერთხელ და არა ყოველდღე.** პროექტს ერთი მომხმარებელი ჰყავს;
#  ყოველდღიური PR-ების ნაკადი იმავე ბედს გაიზიარებდა, რასაც ყვირილა CI —
#  გამოირთვებოდა. `open-pull-requests-limit` იმავე მიზეზით მცირეა.
#
#  ⚠️ **ორივე ეკოსისტემა ქვესაქაღალდეშია** (`/backend`, `/frontend`), ე.ი.
#  `directory` ფესვი არ არის — რეპოს ფესვში არც `composer.json` დგას და არც
#  `package.json`, ამიტომ ნაგულისხმევი `/` აქ ვერაფერს იპოვიდა.
# ============================================================

version: 2

updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ['dependencies', 'backend']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ['dependencies', 'frontend']

  # ⚠️ workflow-ის action-ებიც დამოკიდებულებაა — `actions/checkout@v4`-ის
  # მიტოვებული ვერსია ჩუმად მოძველებულ Node-ზე გადის.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: ['dependencies', 'ci']
